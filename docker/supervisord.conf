# supervisord config for corti all-in-one container.
# PID 1 runs supervisord in foreground (nodaemon=true).
# Both PG and corti log to stdout/stderr for Docker log drivers.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:postgresql]
command=/usr/lib/postgresql/18/bin/postgres -D /home/app/.corti/.index/pg -c config_file=/home/app/.corti/.index/pg/postgresql.conf -c listen_addresses=127.0.0.1 -c port=5432 -c log_destination=stderr -c logging_collector=off
user=postgres
autostart=true
autorestart=true
startsecs=5
startretries=10
stopwaitsecs=30
stopsignal=SIGTERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/1
stderr_logfile_maxbytes=0
redirect_stderr=false

[program:corti]
command=/opt/corti/venv/bin/corti server start --host 0.0.0.0 --port 5473 --root /home/app/.corti --log-level INFO
user=app
autostart=true
autorestart=true
startsecs=5
startretries=5
stopwaitsecs=10
stopsignal=SIGTERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/1
stderr_logfile_maxbytes=0
redirect_stderr=false
environment=HOME="/home/app",CORTI_ROOT="/home/app/.corti",CORTI_API__HOST="0.0.0.0",CORTI_API__PORT="5473",DB_HOST="127.0.0.1",DB_PORT="5432",DB_NAME="corti",DB_USER="corti",DB_PASSWORD="corti_local_2026"
