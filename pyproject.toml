[project]
name = "cortistrate"
version = "0.1.0"
description = "Cortistrate — markdown memory framework for AI agent swarms; cross-machine, multi-agent, self-hosted"
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Cortistrate AI"},
]
keywords = ["memory", "ai-agent", "markdown", "postgresql", "pgvector", "rag", "cortistrate"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

dependencies = [
    # Core data validation & config
    "pydantic>=2.7.1",
    "pydantic-settings>=2.0.0",

    # Storage stack (md-first three-piece set)
    # — Markdown (truth) + SQLite (state) + PostgreSQL/pgvector (vector + BM25)
    "psycopg[binary]>=3.1,<4",    # PostgreSQL driver (native, not PGLite)
    "psycopg-pool>=3.2,<4",       # Async connection pool for psycopg3
    "aiosqlite>=0.20.0",          # Async SQLite driver (used by SA async engine)
    "sqlmodel>=0.0.22",           # ORM (Pydantic + SQLAlchemy 2.0 async)
    "alembic>=1.13.0",            # SQLite schema migrations
    "greenlet>=3.0",              # Required by SQLAlchemy async

    # LLM & embedding (one provider per file pattern)
    "openai>=1.0.0",

    # Markdown / file system
    "PyYAML>=6.0",                # YAML frontmatter parsing
    "watchdog>=4.0.0",            # Cross-platform file system events (cascade daemon)

    # Web framework (entrypoints/api)
    "fastapi>=0.104.0",
    "python-multipart>=0.0.7",    # Required by FastAPI for Form / UploadFile endpoints
    "uvicorn[standard]>=0.24.0",

    # Observability (core/observability)
    "structlog>=24.0.0",
    "prometheus-client>=0.20.0",

    # CLI + TUI
    "typer>=0.12.0",
    "textual>=8.2.7",

    # Tokenization (BM25 Chinese support)
    "jieba>=0.42.1,<1.0",

    # OME (Offline Memory Evolution) async scheduler & file I/O
    "apscheduler>=3.10.4,<4.0",   # async strategy scheduler chassis
    "portalocker>=2.8.2",          # cross-platform file lock for single-engine guard
    "watchfiles>=0.21.0",          # native fs watcher for config hot reload
    "anyio>=4.0",                  # Async file I/O (anyio.Path, to_thread.run_sync) for the markdown layer

    # Vendored algorithm library (formerly everalgo-* PyPI packages).
    # Source lives under src/everalgo/ — see ACKNOWLEDGMENTS.md for attribution.
    "tiktoken>=0.7",              # tokenisation for boundary detection + prompt budget
    "asgiref>=3.0",               # async sync bridge (rank + knowledge modules)
    "httpx>=0.27.0",              # HTTP client for multimodal parser
    "beautifulsoup4>=4.12.0",     # HTML parsing for knowledge extractor
    "pillow>=10.0.0",             # image handling for multimodal parser
    "numpy>=1.26",                # vector ops for clustering algorithm
]

[project.optional-dependencies]
multimodal = ["cairosvg>=2.7.0"]  # SVG parsing support for multimodal content

[project.urls]
Homepage = "https://cortistrate.dev"
Repository = "https://github.com/mark1kwok/cortistrate"
Changelog = "https://github.com/mark1kwok/cortistrate/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/mark1kwok/cortistrate/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cortistrate", "src/everalgo", "src/integrations", "src/scripts"]

# ``env.template`` lives at src/cortistrate/templates/env.template and is
# auto-included via ``packages``. ``cortistrate init`` reads it through
# ``importlib.resources``. No force-include needed.

# sdist uses an include-whitelist (not exclude) so we don't accidentally ship
# things like CLAUDE.md, .claude/, CI configs, or IDE settings. New top-level
# files default to NOT-shipped — you have to opt them in here.
#
# exclude is kept as belt-and-suspenders for build artefacts that CI generates
# inside the project tree (UV_CACHE_DIR=.uv-cache in .gitlab-ci.yml).
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/pyproject.toml",
    "/README.md",
    "/CONTRIBUTING.md",
    "/CODE_OF_CONDUCT.md",
    "/ACKNOWLEDGMENTS.md",
    "/LICENSE",
    "/NOTICE",
    "/config.example.toml",
]
exclude = [".uv-cache", ".venv"]

[project.scripts]
cortistrate = "cortistrate.entrypoints.cli.main:app"

# ───────────────────────────────────────────────────────────────────────────────
# Tooling
# ───────────────────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["src_old"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = [
    "RUF001",  # ambiguous Unicode in strings (intentional × – symbols)
    "RUF002",  # ambiguous Unicode in docstrings
    "RUF003",  # ambiguous Unicode in comments
    "RUF012",  # mutable class attribute default (SQLModel requires this)
]

[tool.ruff.lint.per-file-ignores]
# LoCoMo benchmark embeds LLM prompts (ANSWER_PROMPT / JUDGE_*_PROMPT) and
# verbose argparse help strings as multi-line string literals. Line breaks
# would change what the LLM actually sees or noise the --help output, so
# E501 is silenced for this file only.
"benchmarks/run.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --tb=short -m 'not slow and not live_llm'"
filterwarnings = [
    "error",
    # jieba 0.42.1: unescaped backslashes in regex strings (upstream
    # unmaintained; no fix available).  Python 3.12 emits
    # SyntaxWarning for invalid escape sequences.
    "ignore:invalid escape sequence:SyntaxWarning",
    # aiosqlite teardown: connection-worker thread and Connection.__del__
    # raise after pytest closes the event loop.  Upstream issue
    # (aiosqlite + pytest-asyncio); we cannot fix their lifecycle.
    "ignore:Exception in thread.*_connection_worker_thread:pytest.PytestUnhandledThreadExceptionWarning",
    # aiosqlite + asyncio teardown: Connection.__del__ and
    # BaseEventLoop.__del__ fire after pytest closes the event loop.
    # Upstream lifecycle issue; we cannot fix their cleanup order.
    "ignore:Exception ignored.*:pytest.PytestUnraisableExceptionWarning",
]
markers = [
    "slow: runs that take >=10s (regardless of dependency); CI default excludes these. Run with `pytest -m slow`.",
    "live_llm: requires real LLM / embedder / reranker credentials from .env; burns tokens. CI default excludes. Run with `pytest -m live_llm`.",
]

[tool.coverage.run]
source = ["src/cortistrate"]
branch = true
omit = ["**/__init__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "pragma: no cover",
]

[tool.importlinter]
root_packages = ["cortistrate", "everalgo"]

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "cortistrate.entrypoints",
    "cortistrate.service",
    "cortistrate.memory",
    "cortistrate.infra",
]

[[tool.importlinter.contracts]]
name = "Subpackage internals are private"
type = "forbidden"
source_modules = ["cortistrate.service", "cortistrate.memory", "cortistrate.entrypoints"]
# `**` matches any descendant (writer.py, reader.py, sub.foo.bar, ...).
# Public API must be reached via the subpackage `__init__.py`.
forbidden_modules = [
    "cortistrate.infra.persistence.markdown.**",
    "cortistrate.infra.persistence.pg.**",
    "cortistrate.infra.persistence.sqlite.**",
]
# `forbidden` contracts run a *transitive closure* — any path from a
# source module to a forbidden module fails the check, even when the
# source only imports the subpackage top-level. The whitelist below
# carves out **intra-subpackage wiring**: each storage subpackage's
# own ``__init__.py`` imports its own ``tables`` / ``repos`` / manager
# children to assemble the public API surface that outer layers reach.
# These edges are normal Python package wiring, *not* a privacy
# breach — without these ignores, even a legitimate
# ``from cortistrate.infra.persistence.sqlite import X`` would be punished
# because the transitive scan walks one hop further into the package.
#
# Direct imports from outer layers into a subpackage internal module
# (e.g. ``from cortistrate.infra.persistence.sqlite.tables import X`` written
# in ``service`` or ``entrypoints``) remain blocked — that edge is not
# in this whitelist.
ignore_imports = [
    "cortistrate.infra.persistence.sqlite -> cortistrate.infra.persistence.sqlite.tables",
    "cortistrate.infra.persistence.sqlite -> cortistrate.infra.persistence.sqlite.repos",
    "cortistrate.infra.persistence.sqlite -> cortistrate.infra.persistence.sqlite.sqlite_manager",
    "cortistrate.infra.persistence.pg -> cortistrate.infra.persistence.pg.tables",
    "cortistrate.infra.persistence.pg -> cortistrate.infra.persistence.pg.repos",
    "cortistrate.infra.persistence.pg -> cortistrate.infra.persistence.pg.pg_manager",
    "cortistrate.infra.persistence.markdown -> cortistrate.infra.persistence.markdown.mds",
    "cortistrate.infra.persistence.markdown -> cortistrate.infra.persistence.markdown.writers",
    "cortistrate.infra.persistence.markdown -> cortistrate.infra.persistence.markdown.readers",
]

[[tool.importlinter.contracts]]
name = "OME does not depend on memory/service/entrypoints or sibling infra subpackages"
type = "forbidden"
source_modules = ["cortistrate.infra.ome"]
forbidden_modules = [
    "cortistrate.infra.persistence",
    "cortistrate.memory",
    "cortistrate.service",
    "cortistrate.entrypoints",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.0.0",
    "pytest-rerunfailures>=15.0",
    "import-linter>=2.0",
    "pre-commit>=4.0.0",
    "ipdb>=0.13.13",
    "pyinstrument>=5.0.0",
]
